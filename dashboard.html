<!DOCTYPE html>
<html>
<head>
  <title>SMJ Dashboard</title>
</head>
<body>

<h1>Welcome to SMJ Tournament Dashboard 🔥</h1>
<button onclick="logout()">Logout</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBhKGWQCT6nwTJlZO5LsCeoXQfB6eaSxIw",
    authDomain: "smj-tournament-c078f-2149f.firebaseapp.com",
    projectId: "smj-tournament-c078f-2149f",
    storageBucket: "smj-tournament-c078f-2149f.firebasestorage.app",
    messagingSenderId: "109667694044",
    appId: "1:109667694044:web:8d4fbfcda2292207578b19"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "index.html";
    }
  });

  window.logout = function() {
    signOut(auth).then(() => {
      window.location.href = "index.html";
    });
  }
</script>

</body>
</html>
