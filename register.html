<!DOCTYPE html>
<html>
<head>
    <title>SMJ Tournament Registration</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .form-box {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            animation: fadeIn 0.5s ease-in-out;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #1e3c72;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #2a5298;
            outline: none;
            box-shadow: 0 0 5px rgba(42,82,152,0.5);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #e60000;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #b30000;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .success-message {
            text-align: center;
            color: green;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="form-box">
    <h2>Register Now</h2>

    <form id="registrationForm">
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="email" name="email" placeholder="Email Address" required>
        <input type="tel" name="phone" placeholder="Phone Number" required>
        <button type="submit">Submit Registration</button>
    </form>

    <div class="success-message" id="successMessage">
        ✅ Registration Successful!
    </div>
</div>

<!-- EmailJS Script -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
(function(){
    emailjs.init("ywclQIW0h4K2eXxTc"); // তোমার Public Key
})();

document.getElementById("registrationForm").addEventListener("submit", function(event) {
    event.preventDefault();

    emailjs.sendForm("service_fm4vf5h", "template_m274is9", this)
    .then(function() {
        document.getElementById("successMessage").style.display = "block";
        document.getElementById("registrationForm").reset();
    }, function(error) {
        alert("❌ Failed to send email. Check Service ID / Template ID.");
        console.log(error);
    });
});
</script>

</body>
</html>
