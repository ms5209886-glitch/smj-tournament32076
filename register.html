<!DOCTYPE html>
<html>
<head>
    <title>SMJ Tournament Registration</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #1e3c72, #2a5298);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 300px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background: red;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: darkred;
        }
    </style>
</head>
<body>

<div class="form-box">
    <h2>Register Now</h2>
    <form onsubmit="submitForm(event)">
        <input type="text" placeholder="Full Name" required>
        <input type="email" placeholder="Email" required>
        <input type="tel" placeholder="Phone Number" required>
        <button type="submit">Submit</button>
    </form>
</div>

<!-- EmailJS Script -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
(function(){
    emailjs.init("ywclQIW0h4K2eXxTc");
})();

function submitForm(event) {
    event.preventDefault();

    var name = document.querySelector("input[type='text']").value;
    var email = document.querySelector("input[type='email']").value;
    var phone = document.querySelector("input[type='tel']").value;

    emailjs.send("service_m9tpc5i", "template_m274is9", {
        name: name,
        email: email,
        phone: phone
    })
    .then(function(response) {
        alert("Registration Successful! Check your Gmail.");
        window.location.href = "index.html";
    }, function(error) {
        alert("Failed to send email. Try again.");
    });
}
</script>

</body>
</html>
