<!DOCTYPE html>
<html>
<head>
  <title>SMJ Tournament Login</title>
</head>
<body>

<h2>Register</h2>
<input type="email" id="email" placeholder="Enter Email"><br><br>
<input type="password" id="password" placeholder="Enter Password"><br><br>
<button onclick="register()">Register</button>

<h2>Login</h2>
<button onclick="login()">Login</button>

<p id="message"></p>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword }
  from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBhKGWQCT6nwTJlZO5LsCeoXQfB6eaSxIw",
    authDomain: "smj-tournament-c078f-2149f.firebaseapp.com",
    projectId: "smj-tournament-c078f-2149f",
    storageBucket: "smj-tournament-c078f-2149f.firebasestorage.app",
    messagingSenderId: "109667694044",
    appId: "1:109667694044:web:8d4fbfcda2292207578b19"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.register = function() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    createUserWithEmailAndPassword(auth, email, password)
      .then(() => {
        document.getElementById("message").innerText = "Registration Successful ✅";
      })
      .catch((error) => {
        document.getElementById("message").innerText = error.message;
      });
  }

  window.login = function() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    signInWithEmailAndPassword(auth, email, password)
      .then(() => {
        document.getElementById("message").innerText = "Login Successful ✅";
      })
      .catch((error) => {
        document.getElementById("message").innerText = error.message;
      });
  }
</script>

</body>
</html>
