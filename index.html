<!DOCTYPE html>
<html>
<head>
    <title>SMJ Tournament</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #1e3c72, #2a5298);
            color: white;
            text-align: center;
            padding: 50px;
        }
        .box {
            background: rgba(0,0,0,0.5);
            padding: 30px;
            border-radius: 10px;
            display: inline-block;
        }
        h1 {
            font-size: 40px;
        }
        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            background: orange;
            cursor: pointer;
        }
        button:hover {
            background: red;
            color: white;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>Welcome to SMJ Tournament</h1>
    <p>Register now and join the competition!</p>
    <button onclick="alert('Registration Coming Soon!')">Register</button>
</div>

</body>
</html>
